[project]
name = "mcx-gold-backend"
version = "1.0.0"
description = "MCX Gold Intelligence backend - FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.149",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.20",
  "pandas>=2.2",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "xlrd>=2.0",
  "pypdf>=4.0",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
